version: "3.8"

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: mdrp-osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm_data:/data:ro
    command: osrm-routed --algorithm ch /data/bcs-latest.osrm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/-110.31,24.14;-110.30,24.15"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
